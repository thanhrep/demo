<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sky Ha Giang Loop</title><script src="https://cdn.tailwindcss.com"></script><style>body{font-family:system-ui;color:#12302b;background:linear-gradient(180deg,#dff4ff 0%,#f6f5ef 35%,#dcefd9 100%);background-image:linear-gradient(rgba(246,245,239,.82),rgba(220,239,217,.9)),url('assets/page-background.jpg');background-size:cover;background-attachment:fixed;background-position:center}.hero{min-height:430px;background:linear-gradient(90deg,#062f2bcc,#062f2b22);position:relative}.hero-slides{position:absolute;inset:0;width:100%;height:100%;overflow:hidden}.hero-slides img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;filter:saturate(.9) brightness(.7);animation:heroFade 20s infinite}.hero-slides img:nth-child(1){animation-delay:0s}.hero-slides img:nth-child(2){animation-delay:5s}.hero-slides img:nth-child(3){animation-delay:10s}.hero-slides img:nth-child(4){animation-delay:15s}@keyframes heroFade{0%,22%{opacity:1}25%,97%{opacity:0}100%{opacity:1}}.grass{display:none}.wind-grass{position:fixed;z-index:0;pointer-events:none;bottom:0;left:0;width:100%;height:260px;opacity:.22;background:linear-gradient(to top,rgba(34,120,66,.5),transparent),url('assets/page-background.jpg') center bottom/cover no-repeat;filter:blur(.5px);animation:meadowDrift 12s ease-in-out infinite alternate}.hero .max-w-6xl,main,footer{position:relative;z-index:1}@keyframes meadowDrift{from{background-position:center bottom}to{background-position:calc(50% + 18px) bottom}}>
